name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-test:

    name: Build y pruebas

    runs-on: ubuntu-latest


    env:
      DB_HOST: 127.0.0.1
      DB_NAME: tienda_auth
      DB_USER: root
      DB_PASSWORD: root
      DB_DEBUG: true


    services:

      mysql:

        image: mysql:8.0.33

        command: --default-authentication-plugin=mysql_native_password

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tienda_auth

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20


    steps:


      # ========================================
      # CHECKOUT
      # ========================================

      - name: Descargar código

        uses: actions/checkout@v4



      # ========================================
      # PHP
      # ========================================

      - name: Configurar PHP 7.3

        uses: shivammathur/setup-php@v2

        with:
          php-version: "7.3"
          extensions: pdo,pdo_mysql
          coverage: none



      # ========================================
      # VERSIONES
      # ========================================

      - name: Mostrar versiones

        run: |

          echo "===================="
          echo "PHP"
          echo "===================="

          php -v


          echo "===================="
          echo "EXTENSIONES"
          echo "===================="

          php -m



      # ========================================
      # SINTAXIS PHP
      # ========================================

      - name: Validar sintaxis PHP

        run: |

          echo "Validando archivos PHP..."

          files=$(find . -type f -name "*.php" \
            -not -path "./.git/*")

          for file in $files
          do

            echo "--------------------------------"
            echo "Archivo: $file"

            php -l "$file"

          done



      # ========================================
      # COMPROBAR MYSQL
      # ========================================

      - name: Comprobar MySQL

        run: |

          echo "Probando conexión directa con MySQL..."

          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            -e "SELECT VERSION();"



      # ========================================
      # CREAR TABLA
      # ========================================

      - name: Crear tabla users

        run: |

          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            tienda_auth <<'SQL'


          CREATE TABLE IF NOT EXISTS users (

              id INT AUTO_INCREMENT PRIMARY KEY,

              nombre VARCHAR(100) NOT NULL,

              email VARCHAR(150) NOT NULL UNIQUE,

              password VARCHAR(255) NOT NULL,

              rol ENUM('usuario', 'admin')
                  NOT NULL
                  DEFAULT 'usuario',

              created_at TIMESTAMP
                  DEFAULT CURRENT_TIMESTAMP

          );


          SQL


          echo "Tabla users creada."



      # ========================================
      # VERIFICAR TABLA
      # ========================================

      - name: Verificar tabla users

        run: |

          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            tienda_auth \
            -e "DESCRIBE users;"



      # ========================================
      # SERVIDOR PHP
      # ========================================

      - name: Iniciar servidor PHP

        run: |

          echo "Iniciando PHP..."

          php \
            -S 127.0.0.1:8000 \
            -t auth-service/public \
            > /tmp/php-server.log 2>&1 &


          sleep 5


          echo "Servidor PHP iniciado."



      # ========================================
      # PRUEBA PDO
      # ========================================

      - name: Prueba de conexión PDO

        run: |

          echo "Probando PDO..."

          response=$(curl -s \
            "http://127.0.0.1:8000/test-db.php")


          echo "=============================="

          echo "$response"

          echo "=============================="


          echo "$response" |
            grep -q '"success":true'



      # ========================================
      # REGISTRO
      # ========================================

      - name: Prueba de registro

        run: |

          echo "Probando registro..."

          response=$(curl -s \
            -X POST \
            "http://127.0.0.1:8000/?action=register" \
            -H "Content-Type: application/json" \
            -d '{"nombre":"CI Test","email":"ci@test.com","password":"123456"}')


          echo "=============================="

          echo "RESPUESTA DEL REGISTRO"

          echo "$response"

          echo "=============================="


          if echo "$response" | grep -q '"success":true'
          then

              echo "Registro correcto."

          else

              echo "Registro fallido."

              echo "=============================="
              echo "LOG DEL SERVIDOR PHP"
              echo "=============================="

              cat /tmp/php-server.log || true

              exit 1

          fi



      # ========================================
      # LOGIN
      # ========================================

      - name: Prueba de login

        run: |

          echo "Probando login..."

          response=$(curl -s \
            -X POST \
            "http://127.0.0.1:8000/?action=login" \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@test.com","password":"123456"}')


          echo "=============================="

          echo "RESPUESTA DEL LOGIN"

          echo "$response"

          echo "=============================="


          if echo "$response" | grep -q '"success":true'
          then

              echo "Login correcto."

          else

              echo "Login fallido."

              echo "=============================="
              echo "LOG DEL SERVIDOR PHP"
              echo "=============================="

              cat /tmp/php-server.log || true

              exit 1

          fi



      # ========================================
      # ARTEFACTO
      # ========================================

      - name: Generar artefacto

        run: |

          mkdir -p build


          zip -r \
            build/tiendaVideojuegos_mc.zip \
            . \
            -x ".git/*" \
            -x "build/*"


          echo "=============================="

          echo "ARTEFACTO"

          echo "=============================="

          ls -lh build/



      # ========================================
      # SUBIR ARTEFACTO
      # ========================================

      - name: Subir artefacto

        uses: actions/upload-artifact@v4

        with:

          name: tiendaVideojuegos_mc

          path: build/tiendaVideojuegos_mc.zip

          if-no-files-found: error

          retention-days: 7