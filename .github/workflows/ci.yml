name: CI y publicación Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: tienda_auth
      DB_USER: root
      DB_PASSWORD: root
      DB_DEBUG: "false"

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tienda_auth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.3"
          extensions: pdo,pdo_mysql
          coverage: none

      - name: Validar sintaxis PHP
        run: |
          set -e
          find . -type f -name "*.php" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Validando: $file"
            php -l "$file"
          done

      - name: Comprobar MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot \
            -e "SELECT VERSION();"

      - name: Crear esquemas de autenticación y usuarios
        run: |
          set -e
          mysql -h 127.0.0.1 -P 3306 -u root -proot \
            < database/01-tienda-auth.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot \
            < database/02-tienda-users.sql

          mysql -h 127.0.0.1 -P 3306 -u root -proot \
            -e "SHOW TABLES FROM tienda_auth; SHOW TABLES FROM tienda_users;"

      - name: Iniciar user-service
        working-directory: user-service/public
        run: |
          env \
            USER_DB_HOST=127.0.0.1 \
            USER_DB_NAME=tienda_users \
            USER_DB_USER=root \
            USER_DB_PASSWORD=root \
            php -S 127.0.0.1:8001 -t . \
              > /tmp/user-service.log 2>&1 &

          echo $! > /tmp/user-service.pid
          sleep 2

          if ! kill -0 "$(cat /tmp/user-service.pid)"; then
            cat /tmp/user-service.log
            exit 1
          fi

      - name: Iniciar auth-service
        working-directory: auth-service/public
        run: |
          env \
            DB_HOST=127.0.0.1 \
            DB_NAME=tienda_auth \
            DB_USER=root \
            DB_PASSWORD=root \
            DB_DEBUG=false \
            USER_SERVICE_URL=http://127.0.0.1:8001/internal.php \
            php -S 127.0.0.1:8000 -t . \
              > /tmp/auth-service.log 2>&1 &

          echo $! > /tmp/auth-service.pid
          sleep 2

          if ! kill -0 "$(cat /tmp/auth-service.pid)"; then
            cat /tmp/auth-service.log
            exit 1
          fi

      - name: Prueba de conexión PDO
        run: |
          set -e
          response=$(curl -sS --retry 5 --retry-connrefused \
            --retry-delay 1 http://127.0.0.1:8000/test-db.php)
          echo "$response"
          echo "$response" | grep -q '"success":true'

      - name: Prueba de registro y sincronización
        run: |
          set -e
          response=$(curl -sS \
            -X POST \
            http://127.0.0.1:8000/?action=register \
            -H "Content-Type: application/json" \
            -d '{"nombre":"CI Test","email":"ci@test.com","password":"123456"}')

          echo "Respuesta del registro:"
          echo "$response"
          echo "$response" | grep -q '"success":true'

          auth_count=$(mysql -N -h 127.0.0.1 -P 3306 \
            -u root -proot \
            -e "SELECT COUNT(*) FROM tienda_auth.users WHERE email='ci@test.com';")

          user_count=$(mysql -N -h 127.0.0.1 -P 3306 \
            -u root -proot \
            -e "SELECT COUNT(*) FROM tienda_users.users WHERE email='ci@test.com';")

          test "$auth_count" = "1"
          test "$user_count" = "1"
          echo "Usuario creado y sincronizado."

      - name: Prueba de login
        run: |
          set -e
          response=$(curl -sS \
            -X POST \
            http://127.0.0.1:8000/?action=login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@test.com","password":"123456"}')

          echo "Respuesta del login:"
          echo "$response"
          echo "$response" | grep -q '"success":true'

      - name: Mostrar logs si hay errores
        if: failure()
        run: |
          echo "===== AUTH SERVICE ====="
          cat /tmp/auth-service.log 2>/dev/null || true
          echo "===== USER SERVICE ====="
          cat /tmp/user-service.log 2>/dev/null || true

      - name: Generar artefacto ZIP
        run: |
          set -e
          mkdir -p build
          zip -r build/tiendaVideojuegos_mc.zip . \
            -x ".git/*" "build/*" ".env" ".env.*"
          ls -lh build/

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tiendaVideojuegos_mc
          path: build/tiendaVideojuegos_mc.zip
          if-no-files-found: error
          retention-days: 7

  publish-php-images:
    name: Publicar ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - game-service
          - purchase-service
          - api-gateway

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/php-service.Dockerfile
          push: true
          build-args: |
            SERVICE_DIR=${{ matrix.service }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bugistore-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bugistore-${{ matrix.service }}:sha-${{ github.sha }}

  publish-frontend:
    name: Publicar frontend
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bugistore-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bugistore-frontend:sha-${{ github.sha }}