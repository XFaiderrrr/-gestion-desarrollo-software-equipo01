<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bugistore | Iniciar sesión</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🎮 Bugistore
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>

    </header>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    🎮
                </div>

                <h1>Iniciar sesión</h1>

                <p>
                    Ingresa a tu cuenta de Bugistore
                </p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    Iniciar sesión
                </button>

            </form>

            <div id="loginMessage" class="message"></div>

            <div class="auth-footer">

                <p>
                    ¿No tienes una cuenta?
                    <a href="registro.html">
                        Regístrate aquí
                    </a>
                </p>

            </div>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Bugistore - Proyecto académico de microservicios
        </p>

    </footer>

    <script src="js/auth.js"></script>

</body>
</html>
